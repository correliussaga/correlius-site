title: "Healed But Not Cured"
shortSynopsis: "Jedi Master Thad Correlius travels to Atollon seeking guidance from the Bendu after a Padawan’s criticism reopens old wounds and self-doubt. Through grounding, reflection, and a little humor from Sara back home, Thad is reminded that healing does not require becoming someone else, and that progress can coexist with struggle."
synopsis: "Healed But Not Cured is the first Correlius Journal short film, presenting an intimate look at the journey of healing through the lens of neurodivergent experience. This film examines what it means to move forward while acknowledging that some parts of ourselves may never be 'fixed'—and why that's okay."
