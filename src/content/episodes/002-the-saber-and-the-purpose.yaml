shortSynopsis: "Thad reflects with the Bendu on the blue lightsaber he built during a period when he was still chasing Luke Skywalker’s approval and doubting his own worth. What began as a tool for healing ultimately teaches Thad the difference between support and hiding, and helps shape the way he now mentors his own students."
synopsis: "The Saber And the Purpose is the second Correlius Journal short film, presenting a deep dive into themes of agency, choice, and identity. Through the metaphorical language of the Star Wars universe, this film explores how we claim power over our own narratives and what it means to wield our individual strength with purpose."
