name: Public production smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: public-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLIC_SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - name: Check public routes and playback
        env:
          PUBLIC_SMOKE_BASE_URL: ${{ vars.PUBLIC_SMOKE_BASE_URL }}
          PUBLIC_SMOKE_EPISODE_URL: ${{ vars.PUBLIC_SMOKE_EPISODE_URL }}
        run: node scripts/smoke-public.mjs
