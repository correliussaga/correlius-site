name: Public production smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: public-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check public routes and playback
        env:
          PUBLIC_SMOKE_BASE_URL: ${{ vars.PUBLIC_SMOKE_BASE_URL || 'https://correlius.org' }}
          PUBLIC_SMOKE_EPISODE_URL: ${{ vars.PUBLIC_SMOKE_EPISODE_URL }}
        run: node scripts/smoke-public.mjs
